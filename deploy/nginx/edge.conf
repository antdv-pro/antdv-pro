server {
    listen 80;
    server_name erpxt.online www.erpxt.online _;
    charset utf-8;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.erpxt.online$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name erpxt.online;
    charset utf-8;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types application/json text/plain text/css text/javascript application/javascript application/xml image/svg+xml;
    gzip_vary on;

    ssl_certificate /etc/letsencrypt/live/erpxt.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erpxt.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://web:80;
        proxy_set_header Host www.erpxt.online;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_max_temp_file_size 0;
        proxy_redirect off;
    }

    location / {
        return 301 https://www.erpxt.online$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.erpxt.online;
    client_max_body_size 50m;
    charset utf-8;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types application/json text/plain text/css text/javascript application/javascript application/xml image/svg+xml;
    gzip_vary on;

    ssl_certificate /etc/letsencrypt/live/erpxt.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erpxt.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api {
        return 308 https://www.erpxt.online/api/;
    }

    location /api/ {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_max_temp_file_size 0;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_max_temp_file_size 0;
        proxy_redirect off;
    }
}
