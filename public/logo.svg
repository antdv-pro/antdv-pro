<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Orange and blue geometric logo</title>
  <desc id="desc">A rounded geometric mark with an orange circular form and a blue J-shaped form, separated by white lines.</desc>

  <g stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- Upper orange semicircle -->
